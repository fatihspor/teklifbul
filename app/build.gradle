
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.teklifbul.app'
    compileSdk 35

    signingConfigs {
        release {
            def keystorePath = System.getenv('EUZMAN_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('EUZMAN_STORE_PASSWORD')
                keyAlias System.getenv('EUZMAN_KEY_ALIAS')
                keyPassword System.getenv('EUZMAN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('EUZMAN_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    defaultConfig {
        applicationId 'com.euzman.app'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Bundle the web application into the APK as a local recovery copy.
def bundledWebAssets = file("src/main/assets")
tasks.register('bundleWebApp', Copy) {
    from(rootProject.projectDir) {
        include 'index.html', 'auth.js', 'live.js', 'config.js'
    }
    into bundledWebAssets
}
tasks.named('preBuild').configure { dependsOn tasks.named('bundleWebApp') }
