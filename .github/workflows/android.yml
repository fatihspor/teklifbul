name: eUzman Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Clean and build debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK integrity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -q '^classes.dex$'
          unzip -Z1 "$APK" | grep -q '^AndroidManifest.xml$'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: eUzman-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
