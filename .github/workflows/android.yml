name: eUzman Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check web app before packaging
        run: |
          node --check auth.js
          node --check live.js
          node --check config.js
          test -s index.html
          grep -q 'src="auth.js' index.html
          grep -q 'src="live.js' index.html
          grep -q 'src="config.js' index.html
          grep -q 'https://fatihspor.github.io/teklifbul/' app/src/main/java/com/teklifbul/app/MainActivity.java

      - name: Build APK
        run: |
          set -euo pipefail
          gradle assembleDebug 2>&1 | tee build-log.txt
        shell: bash

      - name: Validate APK package
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 8192
          unzip -t "$APK" | tail -n 2
          unzip -l "$APK"
          unzip -Z1 "$APK" | grep -Fx 'classes.dex'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'launchable-activity:'
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "com.euzman.app"

      - name: Name APK for clear installation
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/eUzman-v1.4.apk

      - name: Test installation on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/eUzman-v1.4.apk 2>&1 | tee install-result.txt
            adb shell pm path com.euzman.app | grep -F "package:"
            adb shell am start -n com.euzman.app/com.teklifbul.app.MainActivity
            sleep 5
            adb shell pidof com.euzman.app
            adb shell dumpsys package com.euzman.app | grep -m 1 'versionName='

      - name: Test installation on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/eUzman-v1.4.apk
            adb shell pm path com.euzman.app | grep -F 'package:'
            adb shell am start -n com.euzman.app/com.teklifbul.app.MainActivity
            sleep 5
            adb shell pidof com.euzman.app

      - name: Publish APK only after successful emulator install
        uses: actions/upload-artifact@v4
        with:
          name: eUzman-v1.4-ANDROID-15-16-TESTED
          path: app/build/outputs/apk/debug/eUzman-v1.4.apk
          if-no-files-found: error

      - name: Report failed installation diagnostics as GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '### Android APK diagnostic failure' > diagnostic.txt
          echo "Commit: ${GITHUB_SHA}" >> diagnostic.txt
          echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> diagnostic.txt
          echo 'Installation result:' >> diagnostic.txt
          if [ -f install-result.txt ]; then cat install-result.txt >> diagnostic.txt; fi
          echo 'Build log tail:' >> diagnostic.txt
          if [ -f build-log.txt ]; then tail -n 65 build-log.txt >> diagnostic.txt; fi
          gh issue create --title "APK installation diagnostic - run ${GITHUB_RUN_NUMBER}" --body-file diagnostic.txt || true

      - name: Preserve diagnostics even when build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eUzman-DIAGNOSTICS-${{ github.run_number }}
          path: |
            diagnostic.txt
            install-result.txt
            build-log.txt
          if-no-files-found: ignore
