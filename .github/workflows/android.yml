name: eUzman Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check web app before packaging
        run: |
          node --check auth.js
          node --check live.js
          node --check config.js
          test -s index.html
          grep -q 'src="auth.js' index.html
          grep -q 'src="live.js' index.html
          grep -q 'src="config.js' index.html
          grep -q 'https://fatihspor.github.io/teklifbul/' app/src/main/java/com/teklifbul/app/MainActivity.java

      - name: Build APK
        run: gradle assembleDebug

      - name: Validate APK package
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 8192
          unzip -t "$APK" | tail -n 2
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name=\u0027com.euzman.app\u0027"

      - name: Name APK for clear installation
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/eUzman-v1.4.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: eUzman-v1.4-APK-YENI
          path: app/build/outputs/apk/debug/eUzman-v1.4.apk
          if-no-files-found: error
