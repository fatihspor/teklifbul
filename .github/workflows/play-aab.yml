name: eUzman Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify signing credentials exist
        env:
          KEYSTORE_B64: ${{ secrets.EUZMAN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EUZMAN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EUZMAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EUZMAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing signing secret: $v"; exit 1; fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/euzman-upload.jks"
          test -s "$RUNNER_TEMP/euzman-upload.jks"
          echo "EUZMAN_KEYSTORE_PATH=$RUNNER_TEMP/euzman-upload.jks" >> "$GITHUB_ENV"
      - name: Build signed release AAB
        env:
          EUZMAN_STORE_PASSWORD: ${{ secrets.EUZMAN_STORE_PASSWORD }}
          EUZMAN_KEY_ALIAS: ${{ secrets.EUZMAN_KEY_ALIAS }}
          EUZMAN_KEY_PASSWORD: ${{ secrets.EUZMAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:bundleRelease
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          test "$(stat -c%s "$AAB")" -gt 8192
          unzip -t "$AAB" | tail -n 2
          unzip -Z1 "$AAB" | grep -F 'base/manifest/AndroidManifest.xml'
          jarsigner -verify "$AAB"
          ls -lh "$AAB"
          sha256sum "$AAB"
      - name: Verify bundle SDK and package metadata
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL --retry 3 -o "$BUNDLETOOL_JAR" https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          java -jar "$BUNDLETOOL_JAR" dump manifest --bundle app/build/outputs/bundle/release/app-release.aab --xpath /manifest/@package | grep -Fx 'com.euzman.app'
          TARGET="$(java -jar "$BUNDLETOOL_JAR" dump manifest --bundle app/build/outputs/bundle/release/app-release.aab --xpath /manifest/uses-sdk/@android:targetSdkVersion)"
          echo "Target SDK: $TARGET"
          test "$TARGET" = "36"
          echo "BUNDLETOOL_JAR=$BUNDLETOOL_JAR" >> "$GITHUB_ENV"
      - name: Build and verify installable APK from AAB
        env:
          EUZMAN_STORE_PASSWORD: ${{ secrets.EUZMAN_STORE_PASSWORD }}
          EUZMAN_KEY_ALIAS: ${{ secrets.EUZMAN_KEY_ALIAS }}
          EUZMAN_KEY_PASSWORD: ${{ secrets.EUZMAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          java -jar "$BUNDLETOOL_JAR" build-apks --bundle app/build/outputs/bundle/release/app-release.aab --output "$RUNNER_TEMP/euzman.apks" --mode universal --ks "$EUZMAN_KEYSTORE_PATH" --ks-key-alias "$EUZMAN_KEY_ALIAS" --ks-pass "pass:$EUZMAN_STORE_PASSWORD" --key-pass "pass:$EUZMAN_KEY_PASSWORD"
          unzip -p "$RUNNER_TEMP/euzman.apks" universal.apk > "$RUNNER_TEMP/eUzman-verified.apk"
          test "$(stat -c%s "$RUNNER_TEMP/eUzman-verified.apk")" -gt 16384
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RUNNER_TEMP/eUzman-verified.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RUNNER_TEMP/eUzman-verified.apk" | grep -E "package:|targetSdkVersion:"
          cp "$RUNNER_TEMP/eUzman-verified.apk" app/eUzman-verified.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: eUzman-verified-APK
          path: app/eUzman-verified.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Google Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: eUzman-Play-v1.5-beta-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
