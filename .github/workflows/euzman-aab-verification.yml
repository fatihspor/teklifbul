name: eUzman AAB Build Verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/euzman-aab-verification.yml'
permissions:
  contents: read
jobs:
  verify-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release bundle
        run: gradle --no-daemon :app:bundleRelease --stacktrace
      - name: Verify bundle archive
        run: |
          BUNDLE=app/build/outputs/bundle/release/app-release.aab
          test -s "$BUNDLE"
          unzip -t "$BUNDLE" | tail -n 2
          ls -lh "$BUNDLE"
          sha256sum "$BUNDLE"
      - uses: actions/upload-artifact@v4
        with:
          name: eUzman-unsigned-AAB-for-verification-only
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
