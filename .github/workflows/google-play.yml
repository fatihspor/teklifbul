name: eUzman Google Play AAB

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/google-play.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.EUZMAN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EUZMAN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EUZMAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EUZMAN_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set EUZMAN_KEYSTORE_BASE64, EUZMAN_STORE_PASSWORD, EUZMAN_KEY_ALIAS and EUZMAN_KEY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.EUZMAN_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/euzman-release.jks"
          echo "855f6f1acbf7a486aabb7129251e9fb92fd757caf2b0be6b8a1e9522b502d9ae  $RUNNER_TEMP/euzman-release.jks" | sha256sum --check --status || { echo "::error::Decoded key does not match the original verified eUzman JKS. Recopy the complete EUZMAN_KEYSTORE_BASE64.txt content."; exit 1; }
          echo "Decoded keystore matches original verified file"
      - name: Validate upload key before build
        env:
          EUZMAN_STORE_PASSWORD: ${{ secrets.EUZMAN_STORE_PASSWORD }}
          EUZMAN_KEY_ALIAS: ${{ secrets.EUZMAN_KEY_ALIAS }}
          EUZMAN_KEY_PASSWORD: ${{ secrets.EUZMAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/euzman-release.jks"
          # Compare only a SHA-256 fingerprint of the original 32-character random password.
          # Never echo the secret, its fingerprint, or the keytool stderr.
          expected_store_password_sha256="d98a65fe20232d6fe6e9366bf0d369ca088879c52b5a73220595a20f2a0614e8"
          actual_store_password_sha256="$(printf '%s' "$EUZMAN_STORE_PASSWORD" | sha256sum | cut -d' ' -f1)"
          if [ "$actual_store_password_sha256" != "$expected_store_password_sha256" ]; then
            echo "::error::EUZMAN_STORE_PASSWORD does not exactly match the original generated password (possible extra/missing character). Recopy only the value from GitHub-Secrets.txt."
            exit 1
          fi
          echo "Store password matches original generated password"
          # Never print keystore contents, alias values, passwords, or keytool stderr.
          if ! keytool -list -keystore "$RUNNER_TEMP/euzman-release.jks" -storepass "$EUZMAN_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore cannot be opened. Check EUZMAN_KEYSTORE_BASE64 and EUZMAN_STORE_PASSWORD (file or store password mismatch)."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/euzman-release.jks" -storepass "$EUZMAN_STORE_PASSWORD" -alias "$EUZMAN_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore opens, but EUZMAN_KEY_ALIAS does not match an entry. Check alias spelling."
            exit 1
          fi
          if ! keytool -importkeystore -srckeystore "$RUNNER_TEMP/euzman-release.jks" -srcstorepass "$EUZMAN_STORE_PASSWORD" -srcalias "$EUZMAN_KEY_ALIAS" -srckeypass "$EUZMAN_KEY_PASSWORD" -destkeystore "$RUNNER_TEMP/key-check.p12" -deststoretype PKCS12 -deststorepass "$EUZMAN_STORE_PASSWORD" -destkeypass "$EUZMAN_STORE_PASSWORD" -noprompt >/dev/null 2>&1; then
            echo "::error::Keystore and alias are valid, but private key password or key entry is invalid. Check EUZMAN_KEY_PASSWORD."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/key-check.p12"
          echo "Upload key validated without exposing credentials"
      - name: Build signed release AAB
        env:
          EUZMAN_KEYSTORE_PATH: ${{ runner.temp }}/euzman-release.jks
          EUZMAN_STORE_PASSWORD: ${{ secrets.EUZMAN_STORE_PASSWORD }}
          EUZMAN_KEY_ALIAS: ${{ secrets.EUZMAN_KEY_ALIAS }}
          EUZMAN_KEY_PASSWORD: ${{ secrets.EUZMAN_STORE_PASSWORD }}
        run: |
          # Generated PKCS12 key uses the same password for the store and private key.
          gradle :app:bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -t app/build/outputs/bundle/release/app-release.aab | tail -n 2
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/aab-signature-check.txt"
          grep -q "jar verified" "$RUNNER_TEMP/aab-signature-check.txt" || { echo "::error::AAB signature verification failed."; exit 1; }
          echo "Signed AAB verified successfully"
      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: eUzman-Google-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/euzman-release.jks"
